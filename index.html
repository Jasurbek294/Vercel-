<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Do'kon</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ecebe8;
      --surface: #f7f6f3;
      --tile: #e2ddd5;
      --tile-2: #d8d0c4;
      --text: #1d1d1b;
      --muted: #6f6c66;
      --line: #dcd8d1;
      --dark: #1d1d1b;
      --on-dark: #ffffff;
      --accent: #b8865b;
      --danger: #c2453d;
      --radius: 22px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0 16px 110px;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    button { font: inherit; border: 0; cursor: pointer; color: inherit; background: none; }
    [hidden] { display: none !important; }

    /* Header */
    .header {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0; background: var(--bg);
    }
    .logo { font-family: 'DM Serif Display', serif; font-size: 1.35rem; letter-spacing: .2px; }
    .icon-btn {
      position: relative; width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--text); display: grid; place-items: center;
    }
    .icon-btn svg { width: 18px; height: 18px; }
    .badge {
      position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 9px; background: var(--dark); color: var(--on-dark);
      font-size: .7rem; font-weight: 600; display: grid; place-items: center;
    }

    /* Hero */
    .hero {
      position: relative; overflow: hidden; border-radius: var(--radius);
      padding: 26px 22px 24px; min-height: 230px;
      background: linear-gradient(135deg, #e9e3da 0%, #d9cfc1 100%);
    }
    .hero h1 { margin: 0 0 10px; font-size: 1.6rem; line-height: 1.2; font-weight: 700; max-width: 230px; }
    .hero p { margin: 0 0 18px; color: #4a4741; font-size: .9rem; line-height: 1.45; max-width: 220px; }
    .hero-art {
      position: absolute; right: -14px; bottom: -16px; font-size: 7.5rem; line-height: 1;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,.15)); pointer-events: none;
    }
    .pill-dark {
      display: inline-block; background: var(--dark); color: var(--on-dark);
      border-radius: 999px; padding: 11px 22px; font-size: .85rem; font-weight: 600;
    }

    /* Search */
    .search {
      display: flex; align-items: center; gap: 8px; margin: 16px 0 0;
      border: 1px solid var(--text); border-radius: 999px; padding: 0 16px; height: 44px;
    }
    .search svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
    .search input { flex: 1; border: 0; background: none; font: inherit; color: var(--text); outline: none; }

    h2 { font-size: 1.35rem; font-weight: 700; text-align: center; margin: 30px 0 16px; }

    /* Categories */
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; padding: 9px 18px; border-radius: 999px;
      background: var(--surface); font-size: .85rem; font-weight: 500;
      box-shadow: 0 1px 2px rgba(0,0,0,.06);
    }
    .chip.active { background: var(--dark); color: var(--on-dark); }

    /* Products */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
    @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .card { display: flex; flex-direction: column; }
    .photo {
      position: relative; aspect-ratio: 1 / 1.08; border-radius: 18px; overflow: hidden;
      background: linear-gradient(160deg, var(--tile) 0%, var(--tile-2) 100%);
      display: grid; place-items: center; font-size: 4rem;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .photo-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
    .round {
      width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.92);
      display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .round svg { width: 15px; height: 15px; }
    .round.on { background: var(--dark); color: var(--on-dark); }
    .tag {
      position: absolute; left: 10px; bottom: 10px; background: #fff; border-radius: 999px;
      padding: 5px 12px; font-size: .72rem; font-weight: 600;
    }
    .info { padding: 10px 4px 0; }
    .name { font-weight: 600; font-size: .92rem; }
    .desc { color: var(--muted); font-size: .78rem; margin-top: 2px; }
    .row-price { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-top: 8px; gap: 8px; }
    .price { font-weight: 700; font-size: .92rem; white-space: nowrap; }
    .row-price .qty { width: 100%; justify-content: space-between; }
    .add {
      width: 34px; height: 34px; border-radius: 50%; background: var(--dark); color: var(--on-dark);
      display: grid; place-items: center; font-size: 1.2rem; flex: none;
    }
    .qty { display: flex; align-items: center; gap: 8px; background: var(--dark); color: var(--on-dark); border-radius: 999px; padding: 3px; }
    .qty button { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.14); font-size: 1rem; }
    .qty span { min-width: 14px; text-align: center; font-weight: 600; font-size: .85rem; }
    .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 30px 0; }

    /* Footer */
    .footer { margin-top: 34px; padding: 20px; border-radius: var(--radius); background: var(--tile); text-align: center; }
    .footer .logo { font-size: 1.15rem; }
    .footer p { margin: 6px 0 0; color: var(--muted); font-size: .8rem; }

    /* Cart bar */
    .cart-bar {
      position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 6;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--dark); color: var(--on-dark); border-radius: 999px;
      padding: 8px 8px 8px 22px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .cart-bar small { display: block; opacity: .65; font-size: .75rem; }
    .cart-bar b { font-size: 1rem; }
    .cart-bar .go { background: #fff; color: var(--dark); border-radius: 999px; padding: 12px 20px; font-weight: 600; font-size: .85rem; }

    /* Sheets */
    .sheet { position: fixed; inset: 0; z-index: 10; background: var(--bg); padding: 0 16px 24px; overflow-y: auto; }
    .sheet-head { display: flex; align-items: center; gap: 12px; padding: 14px 0 6px; position: sticky; top: 0; background: var(--bg); }
    .sheet-head h3 { margin: 0; font-size: 1.2rem; }
    .panel { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-top: 12px; }
    .line { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .line:last-child { border: 0; }
    .thumb { width: 48px; height: 48px; border-radius: 12px; background: var(--tile); display: grid; place-items: center; font-size: 1.6rem; flex: none; overflow: hidden; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .line-main { flex: 1; min-width: 0; }
    .line-main .name { font-size: .88rem; }
    .line-main .desc { margin: 0; }
    .total { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.05rem; padding-top: 12px; }
    label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
    input.field, textarea.field {
      width: 100%; padding: 13px 16px; border-radius: 14px; border: 1px solid var(--line);
      background: #fff; color: var(--text); font: inherit; outline: none;
    }
    input.field:focus, textarea.field:focus { border-color: var(--text); }
    .submit { width: 100%; margin-top: 18px; padding: 15px; text-align: center; }
    .submit:disabled { opacity: .6; }
    .error { color: var(--danger); font-size: .85rem; margin-top: 12px; }
    .done { text-align: center; padding-top: 24vh; }
    .done .big { width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 50%; background: var(--dark); color: #fff; display: grid; place-items: center; font-size: 2.2rem; }
    .done h3 { margin: 0 0 8px; font-size: 1.3rem; }
    .done p { color: var(--muted); margin: 0 0 24px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">Do'kon</div>
    <button class="icon-btn" id="cartIcon" aria-label="Savat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12.1a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9L5 8z"/><path d="M9 11V7a3 3 0 0 1 6 0v4"/></svg>
      <span class="badge" id="badge" hidden></span>
    </button>
  </header>

  <section class="hero">
    <h1>Eng yaxshi mahsulotlar bir joyda</h1>
    <p>Katalogni ko'zdan kechiring va buyurtmani bir necha soniyada bering.</p>
    <button class="pill-dark" id="explore">Katalogni ko'rish</button>
    <div class="hero-art" aria-hidden="true">🛍️</div>
  </section>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Qidirish">
  </div>

  <h2>Kategoriyalar</h2>
  <div class="chips" id="chips"></div>

  <h2 id="catalog">Mashhur mahsulotlar</h2>
  <div class="grid" id="grid"></div>

  <footer class="footer">
    <div class="logo">Do'kon</div>
    <p>Buyurtmalar Telegram orqali qabul qilinadi</p>
  </footer>

  <div class="cart-bar" id="cartBar" hidden>
    <div><small id="cartCount"></small><b id="cartTotal"></b></div>
    <button class="go" id="cartGo">Rasmiylashtirish</button>
  </div>

  <div class="sheet" id="checkout" hidden>
    <div class="sheet-head">
      <button class="icon-btn" id="back" aria-label="Orqaga">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h3>Savat</h3>
    </div>
    <div class="panel" id="summary"></div>
    <form class="panel" id="form">
      <label for="f-name">Ismingiz</label>
      <input class="field" id="f-name" name="name" required maxlength="100">
      <label for="f-phone">Telefon raqam</label>
      <input class="field" id="f-phone" name="phone" type="tel" placeholder="+998" required maxlength="30">
      <label for="f-address">Yetkazib berish manzili</label>
      <input class="field" id="f-address" name="address" required maxlength="300">
      <label for="f-comment">Izoh (ixtiyoriy)</label>
      <textarea class="field" id="f-comment" name="comment" rows="2" maxlength="500"></textarea>
      <div class="error" id="error" hidden></div>
      <button class="pill-dark submit" id="submit" type="submit">Buyurtma berish</button>
    </form>
  </div>

  <div class="sheet done" id="done" hidden>
    <div class="big">✓</div>
    <h3 id="doneTitle"></h3>
    <p>Tez orada siz bilan bog'lanamiz.</p>
    <button class="pill-dark" id="again">Do'konga qaytish</button>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor('#ecebe8'); tg.setBackgroundColor('#ecebe8'); } catch (e) {}
    }

    const $ = (id) => document.getElementById(id);
    const money = (n) => n.toLocaleString('ru-RU') + " so'm";
    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    };
    const icon = (path) => {
      const span = el('span');
      span.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
      return span.firstChild;
    };
    const HEART = '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>';

    let products = [];
    let category = 'Hammasi';
    let query = '';
    const cart = {}; // id -> qty
    let favs = [];
    try { favs = JSON.parse(localStorage.getItem('favs')) || []; } catch (e) {}

    const count = () => Object.values(cart).reduce((a, b) => a + b, 0);
    const total = () => products.reduce((sum, p) => sum + p.price * (cart[p.id] || 0), 0);

    function photo(p, cls) {
      const box = el('div', cls);
      if (p.image) {
        const img = el('img');
        img.src = p.image;
        img.alt = p.name;
        img.loading = 'lazy';
        box.append(img);
      } else {
        box.append(p.emoji || '📦');
      }
      return box;
    }

    function setQty(id, qty) {
      if (qty <= 0) delete cart[id]; else cart[id] = Math.min(qty, 99);
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      render();
    }

    function toggleFav(id) {
      favs = favs.includes(id) ? favs.filter((x) => x !== id) : [...favs, id];
      try { localStorage.setItem('favs', JSON.stringify(favs)); } catch (e) {}
      render();
    }

    function renderChips() {
      const cats = ['Hammasi', 'Sevimlilar', ...new Set(products.map((p) => p.category).filter(Boolean))];
      const box = $('chips');
      box.textContent = '';
      for (const c of cats) {
        const chip = el('button', 'chip' + (c === category ? ' active' : ''), c === 'Sevimlilar' ? '♥ Sevimlilar' : c);
        chip.onclick = () => { category = c; render(); };
        box.append(chip);
      }
    }

    function render() {
      renderChips();
      const grid = $('grid');
      grid.textContent = '';
      const list = products.filter((p) =>
        (category === 'Hammasi' || (category === 'Sevimlilar' ? favs.includes(p.id) : p.category === category)) &&
        p.name.toLowerCase().includes(query)
      );
      if (!list.length) grid.append(el('div', 'empty', 'Hech narsa topilmadi'));

      for (const p of list) {
        const card = el('div', 'card');
        const ph = photo(p, 'photo');

        const actions = el('div', 'photo-actions');
        const fav = el('button', 'round' + (favs.includes(p.id) ? ' on' : ''));
        fav.setAttribute('aria-label', 'Sevimlilarga');
        fav.append(icon(HEART));
        fav.onclick = () => toggleFav(p.id);
        actions.append(fav);
        ph.append(actions);
        if (p.category) ph.append(el('span', 'tag', p.category));
        card.append(ph);

        const info = el('div', 'info');
        info.append(el('div', 'name', p.name));
        if (p.desc) info.append(el('div', 'desc', p.desc));
        const row = el('div', 'row-price');
        row.append(el('span', 'price', money(p.price)));

        const qty = cart[p.id] || 0;
        if (!qty) {
          const add = el('button', 'add', '+');
          add.setAttribute('aria-label', "Savatga qo'shish");
          add.onclick = () => setQty(p.id, 1);
          row.append(add);
        } else {
          const box = el('div', 'qty');
          const minus = el('button', null, '−');
          minus.onclick = () => setQty(p.id, qty - 1);
          const plus = el('button', null, '+');
          plus.onclick = () => setQty(p.id, qty + 1);
          box.append(minus, el('span', null, qty), plus);
          row.append(box);
        }
        info.append(row);
        card.append(info);
        grid.append(card);
      }

      const n = count();
      $('cartBar').hidden = !n;
      $('badge').hidden = !n;
      $('badge').textContent = n;
      $('cartCount').textContent = `${n} ta mahsulot`;
      $('cartTotal').textContent = money(total());
    }

    function renderSummary() {
      const box = $('summary');
      box.textContent = '';
      for (const p of products) {
        if (!cart[p.id]) continue;
        const line = el('div', 'line');
        line.append(photo(p, 'thumb'));
        const main = el('div', 'line-main');
        main.append(el('div', 'name', p.name), el('div', 'desc', money(p.price * cart[p.id])));
        line.append(main);
        const q = el('div', 'qty');
        const minus = el('button', null, '−');
        minus.onclick = () => { setQty(p.id, cart[p.id] - 1); count() ? renderSummary() : closeCheckout(); };
        const plus = el('button', null, '+');
        plus.onclick = () => { setQty(p.id, cart[p.id] + 1); renderSummary(); };
        q.append(minus, el('span', null, cart[p.id]), plus);
        line.append(q);
        box.append(line);
      }
      const t = el('div', 'total');
      t.append(el('span', null, 'Jami'), el('span', null, money(total())));
      box.append(t);
    }

    function openCheckout() {
      if (!count()) return;
      renderSummary();
      $('checkout').hidden = false;
      if (tg && tg.BackButton) tg.BackButton.show();
    }
    function closeCheckout() {
      $('checkout').hidden = true;
      if (tg && tg.BackButton) tg.BackButton.hide();
    }

    $('cartGo').onclick = openCheckout;
    $('cartIcon').onclick = openCheckout;
    $('back').onclick = closeCheckout;
    if (tg && tg.BackButton) tg.BackButton.onClick(closeCheckout);
    $('explore').onclick = () => $('catalog').scrollIntoView({ behavior: 'smooth' });
    $('search').oninput = (e) => { query = e.target.value.trim().toLowerCase(); render(); };
    $('again').onclick = () => { $('done').hidden = true; };

    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      $('f-name').value = [tg.initDataUnsafe.user.first_name, tg.initDataUnsafe.user.last_name].filter(Boolean).join(' ');
    }

    $('form').onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      const btn = $('submit');
      const err = $('error');
      err.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Yuborilmoqda…';
      try {
        const r = await fetch('/api/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: tg ? tg.initData : '',
            items: Object.entries(cart).map(([id, qty]) => ({ id: Number(id), qty })),
            name: f.name.value,
            phone: f.phone.value,
            address: f.address.value,
            comment: f.comment.value,
          }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || 'Xatolik yuz berdi');
        for (const id in cart) delete cart[id];
        render();
        closeCheckout();
        $('doneTitle').textContent = `Buyurtma #${data.orderId} qabul qilindi!`;
        $('done').hidden = false;
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      } catch (e2) {
        err.textContent = e2.message;
        err.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Buyurtma berish';
      }
    };

    fetch('/api/products')
      .then((r) => r.json())
      .then((data) => { products = data; render(); })
      .catch(() => { $('grid').textContent = "Mahsulotlarni yuklab bo'lmadi"; });
  </script>
</body>
</html>
